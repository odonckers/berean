[workspace]
resolver = "2"
members = ["berean-core", "berean-ffi", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/odonckers/berean"

[workspace.dependencies]
# Pinned together: rusqlite_migration 2.6 depends on rusqlite ^0.40, so both
# resolve to the same rusqlite 0.40.x and the error types line up for mapping.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
thiserror = "2"
uniffi = "0.31"
# JWPUB container: outer/inner zip, manifest JSON, SHA-256 hash check,
# AES-128-CBC content decryption, zlib inflate.
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Tests only: the catalog lists each .jwpub's SHA-1.
sha1 = "0.11"
aes = "0.8"
cbc = "0.1"
flate2 = "1"
hex = "0.4"
tempfile = "3"
# Note-body Markdown; no html/getopts features.
pulldown-cmark = { version = "0.13", default-features = false }
# Search suggestions fold words the way the index's tokenizer does
# (lowercase, diacritics removed) to match a typed prefix.
unicode-normalization = "0.1"

# Optimise dependencies (bundled SQLite, AES, zlib, zip) in dev and test
# builds; our own crates stay unoptimised for debugging. Indexing the real
# fixtures in debug was dominated by unoptimised SQLite and inflate.
[profile.dev.package."*"]
opt-level = 2
