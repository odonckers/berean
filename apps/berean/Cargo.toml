# Berean's native workspace: generated by Exact (`.exact/shells/`), copied up beside app.json because the app has
# Rust of its own, the data crate over core/berean-core (docs/frontend-rebuild.md). `bun exact.mjs update` rewrites
# the Exact paths and patches after the pinned checkout moves (exact-version.txt).
[workspace]
members = ["data", "web", "apple", "linux"]
resolver = "2"
exclude = [".sdk"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = ".sdk/exact/vendor/accesskit-windows" }
taffy = { path = ".sdk/exact/vendor/taffy" }
parley = { path = ".sdk/exact/vendor/parley" }
fontique = { path = ".sdk/exact/vendor/fontique" }
wgpu-hal = { path = ".sdk/exact/vendor/wgpu-hal" }
