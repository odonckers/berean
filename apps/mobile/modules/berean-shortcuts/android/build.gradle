plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.odonckers.berean'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.bereanshortcuts"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
