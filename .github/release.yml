# Release notes generated by GitHub from merged pull requests, grouped by the
# labels the labeler workflow adds. Label a PR `skip-changelog` to leave it out.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Dependencies
      labels: ["dependencies"]
    - title: Mobile app
      labels: ["area: mobile"]
    - title: Rust core
      labels: ["area: core"]
    - title: Apple apps
      labels: ["area: apple"]
    - title: CI and tooling
      labels: ["ci"]
    - title: Documentation
      labels: ["docs"]
    - title: Other changes
      labels: ["*"]
