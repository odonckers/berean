name: core

on:
  push:
    # Branches only: path filters don't apply to tag pushes, and the release
    # workflow calls this one for tags.
    branches: ["**"]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  # The release workflow runs these checks on the tagged commit.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Fixtures cache key
        # Only the pinned SHA-256s (first column of the non-comment lines), so
        # comment edits don't bust the cache.
        id: fixtures-key
        run: |
          sums=$(grep -v -e '^#' -e '^[[:space:]]*$' scripts/fixtures.txt | awk '{print $1}' | sha256sum | cut -d' ' -f1)
          echo "key=jwpub-fixtures-$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: core/fixtures
          key: ${{ steps.fixtures-key.outputs.key }}
          # A re-pin of one file still restores the others: old snapshots may
          # be gone from the CDN, and the fetch script re-verifies every hash.
          restore-keys: jwpub-fixtures-

      - name: Fetch fixtures
        # Verifies every cached file's hash and downloads anything missing.
        run: scripts/fetch-fixtures.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Bindgen smoke check
        # Language-neutral: just proves the FFI metadata generates bindings.
        run: |
          cargo build -p berean-ffi
          cargo run --bin uniffi-bindgen -- \
            generate --library target/debug/libberean_ffi.so \
            --language swift --out-dir "$RUNNER_TEMP/bindgen"
          ls "$RUNNER_TEMP/bindgen"
