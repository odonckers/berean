name: core

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Bindgen smoke check
        # Language-neutral: just proves the FFI metadata generates bindings.
        run: |
          cargo build -p berean-ffi
          cargo run --bin uniffi-bindgen -- \
            generate --library target/debug/libberean_ffi.so \
            --language swift --out-dir "$RUNNER_TEMP/bindgen"
          ls "$RUNNER_TEMP/bindgen"
