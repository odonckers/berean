name: screenshots-comment

# Posts what screenshots.yml (the Expo app on Android) or exact.yml (the
# Exact app on the iOS Simulator) captured on its PR, as one comment for
# each that is updated in place (docs/screenshots.md). This runs from main with a write
# token, so it never checks out or runs PR code: it only reads the
# artifact, accepts nothing but PNGs named <screen>/<variant>.png, checks
# that the PR's head is the commit that was captured, and builds the comment
# itself. The images live on the ci-screenshots branch, which holds only the
# latest run of each PR.

on:
  workflow_run:
    workflows: [screenshots, exact]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

# One at a time: every run rewrites the ci-screenshots branch.
concurrency:
  group: screenshots-comment
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # main's own copy of the script, never the PR's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@v8
        id: download
        continue-on-error: true
        with:
          name: ${{ github.event.workflow_run.name == 'exact' && 'screenshots-ios' || 'screenshots' }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact

      - name: Post on the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
          WORK_DIR: ${{ runner.temp }}/pages
        run: node .github/scripts/screenshots-comment.mjs
