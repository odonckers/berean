name: labeler

# pull_request_target so PRs from forks can be labelled. Safe because this
# job never checks out or runs the PR's code: it only reads the list of
# changed files and .github/labeler.yml from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
