name: mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "core/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "core/**"
      - ".github/workflows/mobile.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # The runner disk filled up during Gradle, on top of the Rust, NDK and
      # node builds. Drop preinstalled toolchains this job never uses. The
      # Android SDK (/usr/local/lib/android, ANDROID_HOME) is kept on purpose:
      # Gradle needs its cmdline-tools and React Native's NDK, and NDK r30 is
      # installed there below. Only CodeQL goes from /opt/hostedtoolcache,
      # since setup-node and setup-java use the rest.
      - name: Free disk space
        # apps/mobile doesn't exist before checkout.
        working-directory: /
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/julia* \
            /opt/microsoft \
            /opt/google/chrome \
            /usr/local/share/chromium \
            /opt/az \
            /usr/lib/google-cloud-sdk
          docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci

      # berean-ffi bindings (apps/mobile/modules/berean-ffi-rn). Typecheck
      # needs them, and none of the generated code is committed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # core/target, plus the ubrn CLI that npm builds on first use.
          workspaces: |
            core
            apps/mobile/node_modules/uniffi-bindgen-react-native

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2

      - name: Install the pinned NDK
        env:
          # NDK r30, matching the box (/home/box/android/android-ndk-r30,
          # Pkg.Revision in its source.properties).
          NDK_VERSION: 30.0.16248370
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build berean-ffi for Android and generate bindings
        run: npm run ubrn:android

      - name: Generated code is not tracked
        # Everything ubrn writes must be gitignored, and must not touch
        # tracked files.
        run: |
          git diff --exit-code
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint

      - name: Unit tests
        # node --test over src/**/*.test.ts (no Jest).
        run: npm test

      # Android compile: catches broken Kotlin in the Expo modules
      # (berean-shortcuts, berean-system-bars, berean-ffi-rn) and Gradle
      # changes. Reuses the Rust build and bindings from ubrn above.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle caching. No wrapper is committed (android/ comes from
      # prebuild); setup-gradle only caches here, the generated wrapper runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Prebuild Android
        # After the untracked check: android/ is gitignored, but keep that
        # check looking at a tree only ubrn has touched.
        run: npx expo prebuild --platform android --no-install

      - name: Disk before Gradle
        run: df -h /

      - name: Compile Android (debug, x86_64 only)
        # One ABI for speed, and ubrn only builds the Rust core for
        # arm64-v8a and x86_64.
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace
