name: Berean

options:
  bundleIdPrefix: com.odonckers
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

packages:
  Cupertino:
    path: Cupertino

targets:
  Berean-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
    dependencies:
      - package: Cupertino
        product: CupertinoCore
      - package: Cupertino
        product: CupertinoUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Berean
        PRODUCT_BUNDLE_IDENTIFIER: com.odonckers.berean
        # Every iOS 26 device is arm64, and Xcode 27 only runs on Apple
        # silicon, so arm64 is also the only simulator arch worth building —
        # which is exactly what the core's iOS slices provide.
        ARCHS: arm64
        # iPhone + iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  Berean-macOS:
    type: application
    platform: macOS
    sources:
      # Apps/Shared holds code both apps can use; the Mac @main is in Apps/macOS.
      - path: Apps/Shared
      - path: Apps/macOS
    dependencies:
      - package: Cupertino
        product: CupertinoCore
      - package: Cupertino
        product: CupertinoUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_NAME: Berean
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Berean
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        PRODUCT_BUNDLE_IDENTIFIER: com.odonckers.berean.mac
        # Ad-hoc signed, no sandbox and no entitlements in this pass.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO

  BereanTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/macOS
    dependencies:
      - target: Berean-macOS
      - package: Cupertino
        product: CupertinoCore
      - package: Cupertino
        product: CupertinoUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # Spelled out because PRODUCT_NAME (Berean) differs from the host
        # target's name, which is what XcodeGen's default would use.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Berean.app/Contents/MacOS/Berean"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Explicit shared schemes so `xcodebuild -scheme <name>` works on a freshly
# generated project (before it is ever opened in Xcode). The Cupertino package
# tests are not reachable from an app scheme's test action — XcodeGen can only
# put project targets there — so they run from the package itself; see
# apple/README.md.
schemes:
  Berean-iOS:
    build:
      targets:
        Berean-iOS: all
  Berean-macOS:
    build:
      targets:
        Berean-macOS: all
        BereanTests-macOS: [test]
    test:
      targets:
        - BereanTests-macOS
